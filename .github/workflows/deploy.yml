name: CI/CD Pipeline and Monthly Reports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs automatically on the 1st day of every month at midnight UTC
    - cron: '0 0 1 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        run: |
          if [ -d "tests" ] || ls test_*.py 1> /dev/null 2>&1; then
            pytest
          else
            echo "No tests found, skipping pytest."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  trigger-monthly-job:
    needs: test
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Monthly Growth Report Endpoint
        run: |
          curl -X POST "https://ai-growth-coach-6fpm.onrender.com/dashboard/generate-monthly-reports" \
               -H "Authorization: Bearer ${{ secrets.CRON_SECRET_KEY }}"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render via Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"